<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book courier — SwiftRoute</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><script defer src="js/api.js"></script><script defer src="js/auth.js"></script><script defer src="js/main.js"></script><script defer src="js/booking.js"></script></head>
<body data-layout="app" data-page="book-courier" data-roles="CUSTOMER"><div id="site-shell"></div><template id="page-template"><div class="page-title-row"><div><h1>Book a courier</h1><p>Enter complete package details to create a dispatch and receive your unique tracking number.</p></div><a class="button button-outline" href="track.html">Track an existing parcel</a></div><div id="booking-area"><form id="booking-form" class="card form-card" novalidate><section class="form-section"><div class="form-section-heading"><span class="section-icon">01</span><div><h2>Sender details</h2><p>Who is handing the parcel to our courier?</p></div></div><div class="form-grid"><div class="form-field"><label>Sender name <span class="required">*</span></label><input name="sender_name" required maxlength="120"></div><div class="form-field"><label>Phone <span class="required">*</span></label><input type="tel" name="sender_phone" required maxlength="20"></div><div class="form-field span-2"><label>Email address <span class="required">*</span></label><input type="email" name="sender_email" required maxlength="150"></div><div class="form-field span-2"><label>Address <span class="required">*</span></label><textarea name="sender_address" required maxlength="500" placeholder="House / building, street, area"></textarea></div><div class="form-field"><label>City <span class="required">*</span></label><input name="sender_city" required maxlength="100" placeholder="Ludhiana"></div><div class="form-field"><label>State <span class="required">*</span></label><input name="sender_state" required maxlength="100" placeholder="Punjab"></div><div class="form-field"><label>PIN code <span class="required">*</span></label><input inputmode="numeric" name="sender_pincode" required maxlength="10" placeholder="141001"></div></div></section><section class="form-section"><div class="form-section-heading"><span class="section-icon">02</span><div><h2>Receiver details</h2><p>Where should this shipment be delivered?</p></div></div><div class="form-grid"><div class="form-field"><label>Receiver name <span class="required">*</span></label><input name="receiver_name" required maxlength="120"></div><div class="form-field"><label>Phone <span class="required">*</span></label><input type="tel" name="receiver_phone" required maxlength="20"></div><div class="form-field span-2"><label>Email address <span class="required">*</span></label><input type="email" name="receiver_email" required maxlength="150"></div><div class="form-field span-2"><label>Address <span class="required">*</span></label><textarea name="receiver_address" required maxlength="500" placeholder="House / building, street, area"></textarea></div><div class="form-field"><label>City <span class="required">*</span></label><input name="receiver_city" required maxlength="100"></div><div class="form-field"><label>State <span class="required">*</span></label><input name="receiver_state" required maxlength="100"></div><div class="form-field"><label>PIN code <span class="required">*</span></label><input inputmode="numeric" name="receiver_pincode" required maxlength="10"></div></div></section><section class="form-section"><div class="form-section-heading"><span class="section-icon">03</span><div><h2>Package & delivery service</h2><p>Choose the right service level for your package.</p></div></div><div class="form-grid"><div class="form-field span-2"><label>Package description <span class="required">*</span></label><textarea name="package_description" required maxlength="500" placeholder="Describe contents briefly and accurately"></textarea></div><div class="form-field"><label>Package weight (kg) <span class="required">*</span></label><input type="number" name="package_weight" min="0.05" max="100" step="0.01" required placeholder="0.50"></div><div class="form-field"><label>Package type <span class="required">*</span></label><select name="package_type" required><option value="Parcel">Parcel</option><option value="Document">Document</option><option value="Fragile">Fragile</option><option value="Electronics">Electronics</option><option value="Other">Other</option></select></div><div class="form-field"><label>Delivery type <span class="required">*</span></label><select name="delivery_type" required><option value="Standard">Standard</option><option value="Express">Express</option></select><small>Standard: approx. 5 days · Express: approx. 2 days</small></div><div class="form-field"><label>Declared package value (₹)</label><input type="number" name="declared_value" min="0" max="10000000" step="0.01" value="0"></div><div class="form-field span-2"><div class="price-preview"><span>Estimated shipping charge <small>Final price is securely calculated by the C backend.</small></span><div><strong id="charge-preview">₹0.00</strong><small id="delivery-preview">5 business days</small></div></div></div></div></section><footer class="form-actions"><p>By booking, you confirm that the package information is correct and suitable for courier transport.</p><button class="button" type="submit">Book courier & generate tracking ID</button></footer></form></div></template></body></html>
