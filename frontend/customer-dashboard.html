<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer dashboard — SwiftRoute</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><script defer src="js/api.js"></script><script defer src="js/auth.js"></script><script defer src="js/main.js"></script><script defer src="js/dashboard.js"></script></head>
<body data-layout="app" data-page="customer-dashboard" data-roles="CUSTOMER"><div id="site-shell"></div><template id="page-template"><div class="page-title-row"><div><h1>Welcome to your dashboard</h1><p>Review your bookings, follow active deliveries, and keep your customer profile current.</p></div><a class="button" href="book-courier.html">+ Book courier</a></div><section class="stats-grid" id="customer-stats"><div class="loading-block">Loading your shipment summary…</div></section><section class="panel" id="shipments"><header class="panel-heading"><h2>Recent shipments</h2><a href="book-courier.html">Book another courier</a></header><div class="table-wrap"><table class="data-table"><thead><tr><th>Tracking ID</th><th>Receiver</th><th>Status</th><th>Service</th><th>Actions</th></tr></thead><tbody id="customer-shipments-body"><tr><td colspan="5">Loading shipments…</td></tr></tbody></table></div></section><section class="card profile-card" style="margin-top:20px"><h2>Your profile</h2><p>Update your contact details used for future courier bookings.</p><form id="profile-form" class="form-grid"><div class="form-field"><label>Full name</label><input name="name" required minlength="2" maxlength="120"></div><div class="form-field"><label>Phone number</label><input name="phone" required maxlength="20"></div><div class="form-field span-2"><label>Email address</label><input name="email" type="email" required maxlength="150"></div><div class="form-field span-2"><button class="button" type="submit">Save profile</button></div></form></section></template></body></html>
