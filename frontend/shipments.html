<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shipment management — SwiftRoute</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css"><script defer src="js/api.js"></script><script defer src="js/auth.js"></script><script defer src="js/main.js"></script><script defer src="js/shipments.js?v=2"></script></head>
<body data-layout="app" data-page="shipments" data-roles="ADMIN"><div id="site-shell"></div><template id="page-template"><div class="page-title-row"><div><h1>Shipment management</h1><p>Search, filter, update, assign, and review the complete courier dispatch portfolio.</p></div><button class="button" id="admin-create-shipment" type="button">+ Create shipment</button></div><form class="filter-bar" id="shipment-filters"><div class="field"><input name="search" placeholder="Search tracking ID, sender, receiver, customer"></div><div class="field"><select name="status"><option value="">All statuses</option><option value="BOOKED">Booked</option><option value="PICKED_UP">Picked up</option><option value="IN_TRANSIT">In transit</option><option value="OUT_FOR_DELIVERY">Out for delivery</option><option value="DELIVERED">Delivered</option><option value="DELIVERY_FAILED">Delivery failed</option><option value="CANCELLED">Cancelled</option></select></div><div class="field"><input type="date" name="date_from" title="Booked from"></div><div class="field"><input type="date" name="date_to" title="Booked to"></div><button class="button button-secondary" type="submit">Apply filters</button><button class="button button-outline" type="reset">Reset</button></form><section class="panel" id="shipment-table-panel"><div class="loading-block">Loading shipments…</div></section></template></body></html>
